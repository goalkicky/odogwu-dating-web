</style></head><body><main class="app"><div class="status"><span>9:41</span><span class="icons"><span class="sig"><i></i><i></i><i></i><i></i></span><span class="wifi"></span><span class="bat"></span></span></div><header class="head"><button class="back" id="back">‹</button><h1>Language &amp; Linguistics</h1><div class="counttop"><span id="topCount">0</span>/30 selected</div><p>Select the languages you speak, love or want to learn.</p></header><label class="search"><svg viewBox="0 0 24 24" fill="none"><circle cx="10.8" cy="10.8" r="7.3" stroke="currentColor" stroke-width="1.8"/><path d="M16.2 16.2L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="search" type="search" placeholder="Search languages"></label><section><h2 class="title">All Languages</h2><div class="grid" id="grid"></div></section><section class="selectedArea"><div class="selhead"><h2>Your Selected Languages (<span id="selCount">0</span>)</h2><button class="clear" id="clear">Clear all</button></div><div class="empty"><div class="emptyIcon"><div class="globe"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><circle cx="12" cy="12" r="8.5"/><path d="M3.8 9h16.4M3.8 15h16.4M12 3.5c2.2 2.3 3.2 5 3.2 8.5s-1 6.2-3.2 8.5c-2.2-2.3-3.2-5-3.2-8.5s1-6.2 3.2-8.5Z"/></svg></div><div class="bubble b1">•••</div><div class="bubble b2">•••</div></div><p id="emptyText">You haven't selected any language yet.</p></div></section><button class="save" id="save">Save</button><div class="home"></div></main><script>
const langs=["Igbo","Tsonga","Akan","Lingala","Yoruba","Xhosa","Hausa","Luganda","Luo","Zulu","Urhobo","Duala","Nigerian Pidgin","Nupe","Mandinka","Wolof","Shona","Setswana","Sesotho","Swahili","Kikuyu","Fula","Ndebele","Oshiwambo","Kinyarwanda","Edo","Bemba","Tonga","Siswati","Chichewa","Ebonics","Jamaican Patwah","Haitian Creole","Cameroonian Pidgin"], chosen=new Set(),grid=document.getElementById('grid'),search=document.getElementById('search');function render(){let q=search.value.trim().toLowerCase(),list=q?langs.filter(x=>x.toLowerCase().includes(q)):langs;grid.innerHTML='';list.forEach(n=>{let b=document.createElement('button');b.className='lang'+(chosen.has(n)?' selected':'');b.innerHTML=`<span>${n}</span><span class="plus">+</span>`;b.onclick=()=>{if(chosen.has(n))chosen.delete(n);else if(chosen.size<30)chosen.add(n);else return;update()};grid.appendChild(b)})}function update(){document.getElementById('topCount').textContent=chosen.size;document.getElementById('selCount').textContent=chosen.size;document.getElementById('emptyText').textContent=chosen.size?`${chosen.size} language${chosen.size===1?'':'s'} selected.`:"You haven't selected any language yet.";render()}search.oninput=render;document.getElementById('clear').onclick=()=>{chosen.clear();update()};document.getElementById('save').onclick=e=>{let b=e.currentTarget;b.textContent='Saved ✓';setTimeout(()=>b.textContent='Save',1600)};document.getElementById('back').onclick=()=>history.back();render();
</script></body></html>
