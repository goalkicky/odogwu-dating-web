<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Odogwu Dating — Nearby</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <button class="icon-btn back" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M15.5 4.5 8 12l7.5 7.5"/></svg>
    </button>
    <img class="logo" src="logo.png" alt="Odogwu Dating">
    <button class="icon-btn messages" aria-label="Messages">
      <svg viewBox="0 0 42 42">
        <path d="M8 12.5c0-5 4.2-8.5 10-8.5h5c5.8 0 10 3.5 10 8.5v9c0 5-4.2 8.5-10 8.5h-5l-7 5v-7.2c-2-1.5-3-3.7-3-6.3z" fill="none" stroke="currentColor" stroke-width="2.2"/>
        <circle cx="17" cy="17" r="1.7"/><circle cx="23" cy="17" r="1.7"/><circle cx="29" cy="17" r="1.7"/>
      </svg>
      <span class="badge">3</span>
    </button>
  </header>

  <main>
    <section class="nearby-head">
      <img class="map-icon" src="map.png" alt="">
      <div class="nearby-copy">
        <h1>Nearby</h1>
        <p class="pink-line">Find singles close to you <span>💕</span></p>
        <p>Showing people within 25 km of you</p>
      </div>
      <button class="location-btn" id="locationBtn">
        <svg viewBox="0 0 24 24"><path d="M12 21s7-6.3 7-12a7 7 0 1 0-14 0c0 5.7 7 12 7 12Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9" r="2.2" fill="currentColor"/></svg>
        Change location
      </button>
    </section>

    <section class="profiles" aria-label="Nearby singles">
      <article class="profile"><img src="adanna.jpg" alt="Adanna, 26"></article>
      <article class="profile"><img src="chinedu.jpg" alt="Chinedu, 28"></article>
      <article class="profile"><img src="ifeoma.jpg" alt="Ifeoma, 25"></article>
      <article class="profile"><img src="zainab.jpg" alt="Zainab, 27"></article>
      <article class="profile"><img src="tobi.jpg" alt="Tobi, 30"></article>
      <article class="profile"><img src="amaka.jpg" alt="Amaka, 24"></article>
    </section>

    <section class="premium">
      <div class="premium-icon">
        <svg viewBox="0 0 42 42"><path d="M21 4 35 9v11c0 8.4-5.8 14.2-14 18-8.2-3.8-14-9.6-14-18V9z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15 19l6-4 6 4v7h-12z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </div>
      <div class="premium-copy">
        <strong>Be seen more, get more matches 💕</strong>
        <span>Upgrade to Premium to boost your profile and<br class="desktop-only"> connect with more people near you.</span>
      </div>
      <button class="upgrade">Upgrade</button>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Primary navigation">
    <button class="nav-item">
      <svg viewBox="0 0 32 32"><path d="M6 14 16 5l10 9v12H19v-8h-6v8H6z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m21 11-3 7-7 3 3-7z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>Explore</span>
    </button>
    <button class="nav-item active">
      <span class="discover-ring">
        <svg viewBox="0 0 44 44"><path d="M29 9c-2-2-4.8-3-8-3-8.5 0-13 5.5-13 13.2C8 27 14.1 35 22.8 35 31 35 36 29.7 36 22c0-5.5-2.6-9.4-7-12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="9" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </span>
      <span>Discover</span>
    </button>
    <button class="nav-item has-count">
      <svg viewBox="0 0 32 32"><path d="M6 11.5C6 7.4 9.5 5 14 5h4c4.5 0 8 2.4 8 6.5v6c0 4.1-3.5 6.5-8 6.5h-4l-5 3.5v-5.2c-2-1.1-3-2.9-3-5z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="13" cy="14.5" r="1.3"/><circle cx="17" cy="14.5" r="1.3"/><circle cx="21" cy="14.5" r="1.3"/></svg>
      <i>2</i><span>Messages</span>
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="10" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 27c.8-5.3 4-8 9-8s8.2 2.7 9 8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>Profile</span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>
  <div class="home-indicator"></div>
</div>
<script src="script.js"></script>
</body>
</html>
