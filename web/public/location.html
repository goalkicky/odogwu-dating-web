let selection={name:"Thailand",type:"Country",country:"Thailand",iso:"th",lat:13.7563,lon:100.5018};

const COUNTRY_NAMES={th:"Thailand",ng:"Nigeria",gh:"Ghana",ke:"Kenya",za:"South Africa",eg:"Egypt",et:"Ethiopia",tz:"Tanzania",ug:"Uganda",ma:"Morocco",us:"United States",gb:"United Kingdom",ca:"Canada",in:"India",ph:"Philippines",ae:"United Arab Emirates",sa:"Saudi Arabia",fr:"France",de:"Germany"};
const ALL_CITIES=[];
Object.keys(POPULAR_CITIES).forEach(iso=>{
 POPULAR_CITIES[iso].forEach(c=>{
  ALL_CITIES.push({iso:iso,country:COUNTRY_NAMES[iso]||"",name:c.name,location:c.location,lat:c.lat,lon:c.lon,img:c.img,dist:c.dist});
 });
});

function esc(text){return String(text).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function distanceKm(lat1,lon1,lat2,lon2){
 const R=6371;
 const dLat=(lat2-lat1)*Math.PI/180;
 const dLon=(lon2-lon1)*Math.PI/180;
 const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
 return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}

function buildItems(cities){
 const useHardDist=(selection.iso==="th"&&selection.name==="Bangkok");
 let html="";
 cities.forEach((c,i)=>{
  const dist=(c.dist!==undefined&&useHardDist)?c.dist:distanceKm(selection.lat,selection.lon,c.lat,c.lon)+" km";
  html+='<div class="city-item">'
    +'<img class="city-image" src="'+(c.img||SKYLINES[i%SKYLINES.length])+'" alt="'+esc(c.name)+'">'
    +'<div class="city-info"><div class="city-name">'+esc(c.name)+'</div><div class="city-location">'+esc(c.location)+'</div></div>'
    +'<div class="city-distance">'+esc(dist)+'</div>'
    +'</div>';
 });
 cityList.innerHTML=html;
 Array.prototype.forEach.call(cityList.querySelectorAll(".city-item"),(el,i)=>{
  el.addEventListener("click",()=>selectCity(cities[i]));
 });
}

function renderCities(){
 const cities=(POPULAR_CITIES[selection.iso]||[]).map(c=>Object.assign({},c,{iso:selection.iso,country:selection.country}));
 if(!cities.length){
  cityHeading.textContent="Popular cities";
  cityList.innerHTML='<div class="empty-cities">No popular cities found for this location yet.</div>';
  return;
 }
 cityHeading.textContent="Popular cities in "+selection.country;
 buildItems(cities);
}

function renderSearchResults(value){
 const matches=ALL_CITIES.filter(c=>{
  const n=c.name.toLowerCase();
  const l=c.location.toLowerCase();
  const co=c.country.toLowerCase();
  return n.includes(value)||l.includes(value)||co.includes(value);
 });
 if(!matches.length){
  cityHeading.textContent="No locations found";
  cityList.innerHTML='<div class="empty-cities">No matching locations. Try another search.</div>';
  return;
 }
 cityHeading.textContent="Search results";
 buildItems(matches);
}

function selectCity(city){
 selection.name=city.name;
 selection.type="City";
 selection.country=city.country;
 selection.iso=city.iso;
 selection.lat=city.lat;
 selection.lon=city.lon;
 countryName.textContent=city.name;
 countryType.textContent="City";
 locationButton.textContent="Set location to "+city.name;
 searchInput.value="";
 renderCities();
}

function applySelection(name,type,country,iso,lat,lon){
 selection={name:name,type:type,country:country,iso:iso||"",lat:lat,lon:lon};
 countryName.textContent=name;
 countryType.textContent=type;
 locationButton.textContent="Set location to "+name;
 renderCities();
}

clearSearch.addEventListener("click",()=>{
 searchInput.value="";
 searchInput.focus();
 renderCities();
});

searchInput.addEventListener("input",function(){
 const value=this.value.toLowerCase().trim();
 if(!value){renderCities();}
 else{renderSearchResults(value);}
});

function detectCurrentLocation(silent){
 if(!navigator.geolocation){
  if(!silent) alert("Location detection is not supported.");
  return;
 }
 locationButton.textContent="Detecting location…";
 countryName.textContent="Detecting location…";
 countryType.textContent="…";
 navigator.geolocation.getCurrentPosition(async (pos)=>{
  const lat=pos.coords.latitude;
  const lon=pos.coords.longitude;
  let name="Current location",country="",cc="";
  try{
   const res=await fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat="+lat.toFixed(4)+"&lon="+lon.toFixed(4)+"&zoom=10",{headers:{Accept:"application/json"}});
   const data=await res.json();
   const a=data.address||{};
   name=a.city||a.town||a.village||a.state_district||a.state||a.country||"Current location";
   country=a.country||name;
   cc=(a.country_code||"").toLowerCase();
  }catch(e){}
  applySelection(name,"Current location",country,cc,lat,lon);
  searchInput.value=name;
 },()=>{
  if(countryName.textContent==="Detecting location…"){
   applySelection("Thailand","Country","Thailand","th",13.7563,100.5018);
   searchInput.value="Thailand";
  }
  if(!silent) alert("Unable to detect your location. Please check your location permission.");
 });
}

function goBack(){
 if(history.length>1){history.back();}
 else{location.href="/nearby";}
}

document.getElementById("backArrow").addEventListener("click",goBack);
document.getElementById("chatIcon").addEventListener("click",()=>{location.href="/matches";});
document.getElementById("closeButton").addEventListener("click",goBack);
document.getElementById("currentLocation").addEventListener("click",()=>{detectCurrentLocation(false);});

document.getElementById("locationButton").addEventListener("click",()=>{

 try{
  localStorage.setItem("dogwu_location",JSON.stringify({name:selection.name,type:selection.type,country:selection.country,iso:selection.iso,lat:selection.lat,lon:selection.lon}));
  localStorage.setItem("dogwu_location_justset","1");
 }catch(e){}
 button.textContent="Location set ✓";
 setTimeout(()=>{location.href="/nearby";},1400);
});

applySelection("Thailand","Country","Thailand","th",13.7563,100.5018);
detectCurrentLocation(true);
